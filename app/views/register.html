<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Shop - Inscription</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main>
        <section class="laplaya">
            <div class="container">
                <h1>Inscription</h1>

                <form id="registerForm" class="form" novalidate>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" required placeholder="votre@exemple.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input id="password" name="password" type="password" required placeholder="********">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submitBtn">S'inscrire</button>
                        <a href="/login" class="btn-link">Se connecter</a>
                    </div>

                    <p id="errorMsg" class="error"></p>
                </form>

            </div>
        </section>
    </main>

    <footer id="contact" class="footer">
        <div class="container">
            <p>Projet pedagogique - ETML 183</p>
        </div>
    </footer>

    <script src="/js/nav.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
