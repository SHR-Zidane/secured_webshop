<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Shop - Connexion</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="topbar"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Connexion</h1>
                <form id="loginForm" class="form" novalidate>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" required placeholder="votre@exemple.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input id="password" name="password" type="password" required placeholder="********">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submitBtn">Se connecter</button>
                        <a href="/register" class="btn-link">S'inscrire</a>
                    </div>

                    <p id="errorMsg" class="error" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <footer id="contact" class="footer">
        <div class="container">
            <p>Projet pedagogique - ETML 183</p>
        </div>
    </footer>

    <script src="/js/nav.js"></script>
    <script>
        (function () {
            const form = document.getElementById('loginForm');
            const errorEl = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.textContent = '';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    errorEl.textContent = 'Veuillez remplir tous les champs.';
                    return;
                }

                submitBtn.disabled = true;
                const originalLabel = submitBtn.textContent;
                submitBtn.textContent = 'Connexion...';

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await res.json().catch(() => ({}));

                    if (!res.ok) {
                        errorEl.textContent = data.error || 'Erreur lors de la connexion.';
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalLabel;
                        return;
                    }

                    // Sauvegarde optionnelle et redirection
                    try { localStorage.setItem('user', JSON.stringify(data.user)); } catch (err) { /* ignore */ }
                    window.location.href = '/profile';

                } catch (err) {
                    errorEl.textContent = 'Impossible de contacter le serveur.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalLabel;
                }
            });
        })();
    </script>
</body>
</html>
