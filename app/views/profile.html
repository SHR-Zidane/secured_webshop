<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Secure Shop - Mon Profil</title>
        <link rel="stylesheet" href="/css/main.css" />
    </head>
    <body>
        <div id="topbar"></div>
        <main>
            <section class="profile-header">
                <div class="container">
                    <h1>Mon Profil</h1>
                </div>
            </section>

            <div class="container">
                <div class="profile-card">
                    <div id="photo-container">
                        <div
                            class="profile-photo-placeholder"
                            id="photo-placeholder"
                        >
                            photo
                        </div>
                    </div>

                    <div id="user-info">
                        <div class="info-row">
                            <strong>Nom :</strong>
                            <span id="username">...</span>
                        </div>
                        <div class="info-row">
                            <strong>Email :</strong> <span id="email">...</span>
                        </div>
                        <div class="info-row">
                            <strong>Rôle :</strong> <span id="role">...</span>
                        </div>
                    </div>

                    <hr />

                    <div class="message" id="status-message"></div>

                    <form id="address-form">
                        <div class="form-group">
                            <label for="address">Adresse</label>
                            <input
                                type="text"
                                id="address"
                                name="address"
                                placeholder="Votre adresse complète"
                            />
                        </div>
                        <button type="submit">Mettre à jour l'adresse</button>
                    </form>

                    <hr />

                    <form id="photo-form">
                        <div class="form-group">
                            <label for="photo">Photo de profil</label>
                            <input
                                type="file"
                                id="photo"
                                name="photo"
                                accept="image/*"
                            />
                        </div>
                        <button type="submit">Envoyer la photo</button>
                    </form>
                </div>
            </div>
        </main>

        <footer id="contact" class="footer">
            <div class="container">
                <p>Projet pedagogique - ETML 183</p>
            </div>
        </footer>

        <script src="/js/nav.js"></script>
        <script src="/js/api.js"></script>
        <script src="/js/profile.js"></script>
    </body>
</html>
